; AtomS3 as the RCB-4's COM adapter: a USB-CDC to inverted-UART relay that also
; answers the RCB-4's unused opcode 0x90 with its own IMU, which the board does
; not have. See README.md for the wiring and the protocol.
[platformio]
default_envs = m5stack-atoms3

[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
    -DATOM_S3
    ; Without these Serial is UART0, not the USB port: the host's writes go
    ; nowhere and time out. This is the "USB CDC On Boot: Enabled" the Arduino
    ; IDE asks for. ARDUINO_USB_MODE=1 selects the S3's built-in CDC/JTAG
    ; rather than TinyUSB.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Silence the Arduino log. It goes to Serial, which here is not a console
    ; but the USB CDC carrying a binary control protocol -- one library
    ; complaining mid-frame corrupts whatever the host was reading.
    -DCORE_DEBUG_LEVEL=0
    ; Copy the actor's 235 KiB of weights into SRAM at boot. Read straight
    ; out of memory-mapped flash instead, a forward pass costs 9.8 ms against
    ; 3.0 ms from RAM -- measured on this board, and the difference is cache
    ; line fills, not arithmetic.
    -DPOLICY_WEIGHTS_IN_RAM
    ; ...but not all of them. All 235 KiB will not fit beside the Wi-Fi
    ; stack -- the link overflows DRAM by about 2 KiB -- so this budget is
    ; spent on the largest layers first and the rest are read from flash.
    ;
    ; 202240 is not a round number for a reason: it is exactly the two
    ; largest layers (mlp.2 and mlp.0, 50560 floats). One byte less and the
    ; second of them does not fit, and the budget goes on the three small
    ; ones instead -- which leaves twice as much weight in flash and costs a
    ; measured 1 ms per forward pass.
    -DPOLICY_RAM_WEIGHT_BYTES=202240
lib_deps =
    m5stack/M5Unified@^0.1.12
    mathertel/OneButton
build_src_filter = +<main.cpp>
upload_protocol = esptool

; Timing rig, not firmware. `pio run -e bench -t upload` replaces main with a
; harness that reports how long a forward pass and an RCB-4 servo read really
; take on this chip, which is what decides whether the control loop can live
; here at all. It is a separate env so the numbers come from the same compiler
; flags the real build uses.
[env:bench]
extends = env:m5stack-atoms3
build_src_filter = +<bench.cpp>

; Boots straight into POLICY so the control loop can be exercised from a PC
; with nobody at the button. Safe because POLICY arrives with every servo
; freed and stays that way until a host asks it to run -- but it is a testing
; build, not the one to leave on a robot.
[env:policy-boot]
extends = env:m5stack-atoms3
build_flags =
    ${env:m5stack-atoms3.build_flags}
    -DSTART_MODE_INDEX=2

; Measures how much heap is left beside the policy's 235 KiB of weights once
; a radio is up, which is what decides whether this can go wireless at all
; and by which route. See README, "無線化".
[env:wifi-probe]
extends = env:m5stack-atoms3
build_src_filter = +<wifi_probe.cpp>
