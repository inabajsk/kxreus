[project]
name = "walking-kxr-rl"
version = "0.1.0"
description = "Stand-up + walk RL, trained across many KXR modular leg-type robots: mjlab (MuJoCo-Warp) + rsl_rl PPO"
requires-python = ">=3.12,<3.13"

# Same pinned combination walking-hand-rl validated -- see its README section 7
# for why each of these is pinned rather than left to the resolver.
dependencies = [
  "mjlab==1.2.0",
  "mujoco==3.5.0",
  "mujoco-warp==3.5.0",
  "warp-lang==1.12.0",
  "scikit-robot>=0.3.21",
  "wandb==0.28.1",
  "scipy",
  "imageio",
  "imageio-ffmpeg",
  "onnx",
  "onnxruntime",
  "pyyaml",
  # tools/montage.py: per-robot resize + name label burned into the frame.
  "opencv-python-headless",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kxr_rl"]

[tool.uv]
python-preference = "only-managed"
