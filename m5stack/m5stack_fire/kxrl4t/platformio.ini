; M5Stack FIRE as the RCB-4's COM adapter, running kxrl4t's trained walk
; policy.
;
; This tree (~/kxreus/m5stack/m5stack_fire/kxrl4t) is independent of
; ~/kxreus/atom_m5stickv_phone: M5Stack FIRE is a much more capable board
; than an ATOM (a real LCD, three buttons, PSRAM, extra Grove-style ports),
; and sharing one codebase across both meant most of it was wrapped in
; `#if defined(ARDUINO_M5STACK_FIRE)` just to keep the two apart. src/ and
; lib/ here are this board's own copy -- adapted from, not shared with, the
; ATOM firmware under atom_m5stickv_phone/atom_common (see that tree if a
; change there ought to be ported here too, and vice versa; there is no
; automatic link between them any more).
[platformio]
default_envs = m5stack-fire

; Board notes (see rcb4_link.h/.cpp and main.cpp for the code side of each):
;   - Chip: original ESP32 (dual Xtensa LX6), not ESP32-S3 -- so no native
;     USB CDC. Serial is a real UART0 carried out over this board's CP2104
;     USB-UART bridge chip (appears as /dev/ttyUSBn, not /dev/ttyACMn), which
;     is also why there is no --no-stub upload workaround to carry over:
;     esptool's normal stub loader works fine here.
;   - RCB-4 UART: Port B (G26 TX / G36 RX, this chip's UART2) -- NOT Port C
;     (G17/G16) despite that being the board's own silkscreened "serial"
;     port: G16/G17 on FIRE are also wired to its PSRAM chip, and using them
;     for anything else was measured (2026.9, real hardware) to leave Port
;     C's UART unable to reach an RCB-4 at all, wiring otherwise confirmed
;     correct -- see rcb4_link.h's own TX_PIN/RX_PIN comment, including why
;     this is also the likely explanation for this same env's earlier PSRAM
;     self-test failures (below).
;   - M5StickV I2C: Port E (G5 SCL / G13 SDA), its own I2C_NUM_1 peripheral
;     -- NOT Port A (G21/G22): M5Unified wires Port A to the exact same pins
;     as this board's own internal IMU, so an M5StickV there shares that bus
;     electrically and was measured (2026.9, real hardware) corrupting the
;     internal IMU's own readings, sometimes to the point of it not being
;     detected at all -- see rcb4_link.h's own M5STICKV_SDA_PIN comment.
;   - Button: the three physical buttons M5Unified already reads (M5.BtnA)
;     -- see main.cpp.
;   - RAM: 520 KiB internal SRAM plus 4 MiB of PSRAM (BOARD_HAS_PSRAM), but
;     with far less of that SRAM free for a program's own static buffers
;     than an ESP32-S3's 512 KiB, once WiFi/BT/lwIP's own static allocations
;     are out of it -- a plain `float g_ram[43648]` (174592 bytes) overflowed
;     DRAM by 107 KiB (measured). PSRAM looks like the
;     obvious place to put that one buffer instead (see policy.cpp's own
;     POLICY_RAM_IN_PSRAM, EXPERIMENTAL and NOT enabled below): ps_malloc()
;     into it was measured to corrupt the heap allocator standing alone, and
;     to instead hang the boot under a task watchdog once this env's full
;     mode set (Bridge/Status/PolicyMode) was linked in -- and separately,
;     this same build was, at the time, ALSO fighting its own PSRAM another
;     way: Rcb4Link::begin() was still using Port C (G16/G17), which this
;     chip also uses for PSRAM (see the RCB-4 UART entry above) -- a very
;     plausible root cause for the SDK's own boot-time memory self-test
;     failing intermittently ("spiram: SPI SRAM memory test fail") that
;     hadn't been identified yet when POLICY_RAM_IN_PSRAM was shelved. Worth
;     retrying now that the UART has moved to Port B instead, but NOT yet
;     re-tried -- POLICY_WEIGHTS_IN_RAM stays OFF here until it is: every
;     layer simply stays in flash on this chip, which already works (see
;     policy.cpp's own select()), just slower (measured: 17.6 ms/forward
;     pass here vs. flash, still comfortably inside the 25 ms/40 Hz control
;     budget on its own).
[env:m5stack-fire]
platform = espressif32
board = m5stack-fire
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; esptool's normal stub loader closes and reopens the port mid-upload to
; hand control to a second-stage RAM stub -- on this board's CP2104 that
; reopen was measured failing every time ("cp210x ttyUSB0: failed set
; request 0x0 status: -32" / "Unable to enable UART" in dmesg, reproduced
; on a freshly replugged cable, so not just heat/wear from repeated
; flashing). Talking to the ROM bootloader directly instead is slower but
; never does that reopen -- the same fix AtomS3's own upload_flags uses,
; for a different USB path (native CDC there, CP2104 here) hitting the same
; class of symptom.
upload_flags = --no-stub
build_flags =
    -DROBOT_NAME=\"kxrl4t\"
    -DCORE_DEBUG_LEVEL=0
    ; FIRE's screen mounts landscape by default (M5GFX rotation 0); this
    ; robot's case wants it turned 90 degrees. 1 and 3 are M5GFX's two
    ; 90-degree options (opposite directions) -- see main.cpp's own
    ; DISPLAY_ROTATION comment (kxrl2g's AtomS3 build overrides it to
    ; 2/180 the same way). If the text comes up upside down or mirrored on
    ; this case, flip this to 3.
    -DDISPLAY_ROTATION=1
lib_deps =
    m5stack/M5Unified@^0.1.12
build_src_filter = +<main.cpp>
upload_protocol = esptool

; Timing rig, not firmware. `pio run -e bench -t upload` replaces main with a
; harness that reports how long a forward pass and an RCB-4 servo read really
; take on this chip, which is what decides whether the control loop can live
; here at all. It is a separate env so the numbers come from the same compiler
; flags the real build uses.
[env:bench]
extends = env:m5stack-fire
build_src_filter = +<bench.cpp>

; Boots straight into POLICY so the control loop can be exercised from a PC
; with nobody at the button. Safe because POLICY arrives with every servo
; freed and stays that way until a host asks it to run -- but it is a testing
; build, not the one to leave on a robot.
[env:policy-boot]
extends = env:m5stack-fire
build_flags =
    ${env:m5stack-fire.build_flags}
    -DSTART_MODE_INDEX=2

; Measures how much heap is left beside the policy's weights once a radio is
; up, which is what decides whether this can go wireless at all and by which
; route.
[env:wifi-probe]
extends = env:m5stack-fire
build_src_filter = +<wifi_probe.cpp>

; Prints what M5Unified detects and what it reports, in library units.
[env:imu-probe]
extends = env:m5stack-fire
build_src_filter = +<imu_probe.cpp>

; M5Stack GRAY (ARDUINO_M5Stack_Core_ESP32/ARDUINO_M5STACK_CORE_ESP32) --
; PlatformIO board `m5stack-core-esp32`, not `m5stack-fire`. Chosen over
; FIRE for THIS robot specifically because rcb4_link.h's M5STICKV_SDA_PIN/
; SCL_PIN (Port E, G5/G13) need real wires soldered/jumpered to them, and
; GRAY's case brings its GPIO header out the side where that is possible --
; FIRE's case exposes neither its side nor its back, only the three Grove
; ports (A/B/C), so Port E is physically unreachable there without cutting
; the case open.
;
; M5Unified maps GRAY to the exact same internal board_t (board_M5Stack) as
; FIRE -- same pin table entirely (Port A/internal IMU sharing G21/G22, Port
; B on G26/G36, Port C on G16/G17, Port E on G5/G13) -- so nothing in src/ or
; lib/ needed to change; only `board` below differs. The one real hardware
; difference that matters here: GRAY has no PSRAM (no BOARD_HAS_PSRAM, 320
; KiB RAM total instead of FIRE's 520 KiB SRAM + 4 MiB PSRAM) -- moot for
; this firmware, which measured only ~57 KiB of actual RAM use on FIRE and
; keeps the policy's weights in flash either way (see POLICY_RAM_IN_PSRAM's
; own comment above, never enabled).
;
; board_build.partitions: GRAY's default OTA-style partition table splits its
; 4 MiB flash into two ~1.25 MiB app slots (app0/app1) plus SPIFFS -- this
; firmware alone measured 1.27 MiB, 96.7% of one such slot, with no OTA
; update mechanism here to ever need the second copy. huge_app.csv trades
; that spare OTA slot for one 3 MiB app partition instead (plus a small
; SPIFFS this firmware does not use either), which is what FIRE's own
; default_16MB.csv effectively already gave it for free.
[env:m5stack-gray]
extends = env:m5stack-fire
board = m5stack-core-esp32
board_build.partitions = huge_app.csv

