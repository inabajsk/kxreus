; M5StickC as the RCB-4's COM adapter, running kxrl4t's trained walk policy.
;
; This directory (~/kxreus/m5stack/m5stickc_m5stickv_kxrl4t/m5stickc) is
; fully independent -- own src/, own lib/, nothing shared with
; ~/kxreus/m5stack/m5stack_fire/kxrl4t, ~/kxreus/m5stack/m5stickc_m5unitv_
; kxrl4t (kxrl4t's own UnitV-camera sibling tree), or
; ~/kxreus/atom_m5stickv_phone. Build and flash from here (`pio run`,
; `./flash.sh <port>`); the M5StickV's own MaixPy source lives one level
; up, in ../m5stickv/ (see that directory's own README.md and flash.sh --
; a separate build, over the M5StickV's own USB port, not PlatformIO).
; ../flash.sh flashes both boards together in one call; see ../README.md.
;
; Why M5StickC over FIRE/GRAY for this robot: the M5StickV needs its own I2C
; bus, separate from whichever bus this board's own internal IMU is on (see
; rcb4_link.h's own M5STICKV_SDA_PIN comment for the FIRE/GRAY finding that
; drove this -- an M5StickV sharing the internal IMU's bus was measured
; corrupting that IMU's own readings). M5StickC already keeps its Grove
; connector on a bus of its own, separate from the internal IMU, by design
; (M5Unified's own board_M5StickC pin table: internal IMU G22/G21, Grove
; G33 SCL/G32 SDA) -- no free-GPIO hunting or case modification needed the
; way FIRE (no side/back pin access at all) and GRAY (this build's own G5/
; G13 choice turned out to double as this board's own LCD SPI pins) both
; required.
[platformio]
default_envs = m5stickc

; Board notes (see rcb4_link.h/.cpp and main.cpp for the code side of each):
;   - Chip: ESP32 PICO-D4 (dual Xtensa LX6), 4 MiB flash, no PSRAM, 320 KiB
;     RAM -- this firmware measured ~57 KiB of actual use on the same code
;     built for M5Stack FIRE, comfortably inside that.
;   - RCB-4 UART: the bottom HAT connector's G26(TX)/G36(RX) -- free GPIOs
;     on this board, not claimed by the LCD, the Grove port, or the
;     internal IMU. G36 is one of this chip's input-only pins
;     (GPIO34-39), which is fine for RX.
;   - M5StickV I2C: the Grove connector itself (G33 SCL/G32 SDA) -- see the
;     top comment and rcb4_link.h's own M5STICKV_SDA_PIN comment for why
;     this board needs no separate/free pin pair the way FIRE/GRAY did.
;   - Button: only M5.BtnA (the front "M5" button) is used, same as every
;     other board this firmware runs on -- see main.cpp. M5StickC's side
;     button (BtnB) is read by M5Unified too but nothing here uses it.
;   - Display: 80x160 (M5StickC) or 135x240 (M5StickCPlus), auto-detected by
;     M5Unified/M5GFX from the panel ID -- DISPLAY_ROTATION below may need
;     retuning for this screen's own orientation versus FIRE/GRAY's.
;
; board_build.partitions: this board's default OTA-style partition table
; splits its 4 MiB flash into two ~1.25 MiB app slots plus SPIFFS -- this
; firmware alone measured 1.27 MiB (96.7% of one such slot on GRAY, the same
; chip family), with no OTA update mechanism here to ever need the second
; copy. huge_app.csv trades that spare OTA slot for one 3 MiB app partition
; instead (plus a small SPIFFS this firmware does not use either).
[env:m5stickc]
platform = espressif32
board = m5stick-c
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
; --no-stub (FIRE/GRAY's own workaround for their CP2104 chip failing to
; reopen the port mid-upload) was tried here first but made things WORSE:
; real M5StickC hardware (2026.9) failed at the ROM bootloader's own flash-ID
; probe every time with --no-stub ("Failed to communicate with the flash
; chip" / "Serial data stream stopped"), while a plain `esptool flash_id`
; using the normal stub loader read the chip fine (4 MiB, manufacturer c8).
; Left at esptool's default (stub loader, upload_speed unset) accordingly.
build_flags =
    -DROBOT_NAME=\"kxrl4t\"
    -DCORE_DEBUG_LEVEL=0
    ; M5GFX's rotation for this board's own screen orientation in whatever
    ; case/mount this robot uses -- see main.cpp's own DISPLAY_ROTATION
    ; comment. Retune once mounted; 0 is this library's own default.
    -DDISPLAY_ROTATION=0
lib_deps =
    m5stack/M5Unified@^0.1.12
    ; The phone control page's own HTTPS server (see lib/https_server) --
    ; SpeechRecognition needs a secure context, which the plain WebServer
    ; this build already runs cannot offer. PsychicHttp wraps ESP-IDF's own
    ; HTTP server (esp_http_server/esp_https_server, both present for
    ; classic ESP32 -- confirmed against this platform's own installed
    ; framework, not just ESP32-S3), in an Arduino-WebServer-like API, and
    ; is the library https://github.com/iory/atoms3-voice-control's own
    ; local-ip.sh-certificate approach is built on.
    hoeken/PsychicHttp@^3.1.2
build_src_filter = +<main.cpp>
upload_protocol = esptool

; Timing rig, not firmware. `pio run -e bench -t upload` replaces main with a
; harness that reports how long a forward pass and an RCB-4 servo read really
; take on this chip, which is what decides whether the control loop can live
; here at all. It is a separate env so the numbers come from the same compiler
; flags the real build uses.
[env:bench]
extends = env:m5stickc
build_src_filter = +<bench.cpp>

; Boots straight into POLICY so the control loop can be exercised from a PC
; with nobody at the button. Safe because POLICY arrives with every servo
; freed and stays that way until a host asks it to run -- but it is a testing
; build, not the one to leave on a robot.
[env:policy-boot]
extends = env:m5stickc
build_flags =
    ${env:m5stickc.build_flags}
    -DSTART_MODE_INDEX=2

; Measures how much heap is left beside the policy's weights once a radio is
; up, which is what decides whether this can go wireless at all and by which
; route.
[env:wifi-probe]
extends = env:m5stickc
build_src_filter = +<wifi_probe.cpp>

; Prints what M5Unified detects and what it reports, in library units.
[env:imu-probe]
extends = env:m5stickc
build_src_filter = +<imu_probe.cpp>

; ESP-NOW init/add_peer/send return codes and every packet seen, printed to
; Serial (free to use here -- unlike the real bridge, this build never
; carries RCB-4 traffic on it).
[env:espnow-probe]
extends = env:m5stickc
build_src_filter = +<espnow_probe.cpp>
