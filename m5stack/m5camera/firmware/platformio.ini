; M5Camera (ESP32-D0WDQ6 + 4 MiB flash + 8 MiB PSRAM + OV2640, CP2104 USB)
; as a Wi-Fi JPEG streamer for ../m5camera_viewer.py.
;
; Build/flash:  pio run -t upload --upload-port /dev/ttyUSB1
; Wi-Fi setup:  ../provision_wifi.py /dev/ttyUSB1  (or "wifi <ssid> <pass>"
;               typed on the serial console) -- credentials live in NVS,
;               never in this tree.
[platformio]
default_envs = m5camera

[env:m5camera]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
