; AtomS3 as the RCB-4's COM adapter, running ONE OF kxrl4t/kxrl4d/kxrl6/
; kxrl2g's own trained walk policy (kxrl4d also getup) or kxra6g's own
; onboard motion table (no trained policy at all -- see lib/policy/
; policy.h's own RobotId comment), talking I2C to an M5StickV/UnitV over
; its Grove connector.
;
; Unlike every atoms3_m5stickv_kxrl2g/m5stickc_* tree this one was
; consolidated from, this same compiled image carries all five robots'
; own actors (or, for kxra6g, motion table) and servo mappings at once.
; WHICH of the five a given physical unit actually is gets set per unit,
; in NVS, with a serial "robot <name>" command (see net.cpp's own
; handleSetupLine()), not by editing this file or by a different build
; per robot: there is exactly one firmware image, one build_flags list,
; and one binary to flash onto any of them.
;
; This directory (~/kxreus/m5stack/atoms3_m5stickv_kxr5s/atoms3) is fully
; independent -- own src/, own lib/, nothing shared with
; ~/kxreus/atom_m5stickv_phone/atom_common or ~/kxreus/atom_phone/atom_common
; (both of which this tree's lib/ was originally derived from, then brought
; up to the same architecture the m5stickc_* trees now run: EspNowLink/
; HostRelay/https_server/cert_store, Rcb4Link's passthrough-enable + frame-
; stall watchdog, the current phone page). Build and flash from here
; (`pio run`, `pio run -t upload`).
;
; RCB-4 UART: G6(TX)/G5(RX), the solder pads on the board's underside --
; NOT the Grove connector's G2/G1, which this build needs free for the
; M5StickV's I2C (see lib/rcb4_link's own comment). Matches
; atom/s3_echo_with_I2C's own atoms3_i2c_robot.ino, which established this
; pin move first.
[platformio]
default_envs = m5stack-atoms3

[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; The stub loader esptool normally uploads to RAM makes the S3's native USB
; CDC briefly drop and re-enumerate -- which is exactly the step failing here
; ("Stub running..." then no answer). Talking to the ROM bootloader directly
; instead is slower but does not touch the USB peripheral's config.
upload_flags = --no-stub
build_flags =
    -DATOM_S3
    ; Deliberately NO -DROBOT_NAME/-DDISPLAY_ROTATION here, unlike every
    ; tree this was consolidated from: which physical robot this unit is,
    ; and which way its LCD is mounted, are both runtime facts now (see
    ; policy::robotId()/displayRotation(), NVS-backed), not compile-time
    ; ones -- the whole point of this tree is one binary for all four
    ; robots, so nothing here can vary per robot any more.
    ; Without these Serial is UART0, not the USB port: the host's writes go
    ; nowhere and time out. This is the "USB CDC On Boot: Enabled" the Arduino
    ; IDE asks for. ARDUINO_USB_MODE=1 selects the S3's built-in CDC/JTAG
    ; rather than TinyUSB.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Silence the Arduino log. It goes to Serial, which here is not a console
    ; but the USB CDC carrying a binary control protocol -- one library
    ; complaining mid-frame corrupts whatever the host was reading.
    -DCORE_DEBUG_LEVEL=0
    ; Deliberately NOT -DPOLICY_WEIGHTS_IN_RAM, unlike the atom_m5stickv_
    ; phone tree this was derived from: that tree's own 211456-byte static
    ; g_ram[] cache, kept alongside this build's own ~123 KiB upload-buffer
    ; malloc (see lib/policy's own kUploadBufBytes comment), leaves too
    ; little RAM for Wi-Fi/BT to come up at all -- reproduced on real
    ; hardware as a boot-time crash loop (the AtomS3's own USB-CDC port
    ; flickering in and out of enumeration, never settling). Matches
    ; every m5stickc_* tree's own choice: weights simply stay in flash
    ; (slower forward pass, no RAM cost) rather than trade the runtime
    ; upload feature away to make room for a speed optimization neither
    ; of those trees needed either.
lib_deps =
    m5stack/M5Unified@^0.1.12
    mathertel/OneButton
    ; The phone control page's own HTTPS server (see lib/https_server) --
    ; SpeechRecognition needs a secure context, which the plain WebServer
    ; this build already runs cannot offer. PsychicHttp wraps ESP-IDF's own
    ; HTTP server (esp_http_server/esp_https_server), in an Arduino-
    ; WebServer-like API, and is the library
    ; https://github.com/iory/atoms3-voice-control's own local-ip.sh-
    ; certificate approach is built on.
    hoeken/PsychicHttp@^3.1.2
build_src_filter = +<main.cpp>
upload_protocol = esptool

; Timing rig, not firmware. `pio run -e bench -t upload` replaces main with a
; harness that reports how long a forward pass and an RCB-4 servo read really
; take on this chip, which is what decides whether the control loop can live
; here at all. It is a separate env so the numbers come from the same compiler
; flags the real build uses.
[env:bench]
extends = env:m5stack-atoms3
build_src_filter = +<bench.cpp>

; Boots straight into POLICY so the control loop can be exercised from a PC
; with nobody at the button. Safe because POLICY arrives with every servo
; freed and stays that way until a host asks it to run -- but it is a testing
; build, not the one to leave on a robot.
[env:policy-boot]
extends = env:m5stack-atoms3
build_flags =
    ${env:m5stack-atoms3.build_flags}
    -DSTART_MODE_INDEX=2

; Measures how much heap is left beside the policy's weights once a radio is
; up, which is what decides whether this can go wireless at all and by which
; route.
[env:wifi-probe]
extends = env:m5stack-atoms3
build_src_filter = +<wifi_probe.cpp>

; Prints what M5Unified detects and what it reports, in library units.
[env:imu-probe]
extends = env:m5stack-atoms3
build_src_filter = +<imu_probe.cpp>

; ESP-NOW init/add_peer/send return codes and every packet seen, printed to
; Serial (free to use here -- unlike the real bridge, this build never
; carries RCB-4 traffic on it).
[env:espnow-probe]
extends = env:m5stack-atoms3
build_src_filter = +<espnow_probe.cpp>
