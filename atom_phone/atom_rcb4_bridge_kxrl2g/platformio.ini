; AtomS3 as the RCB-4's COM adapter, running kxrl2g's trained walk policy.
; See ../atom_rcb4_bridge_kxrl4d/platformio.ini for the fuller commentary --
; this file differs from it only in ROBOT_NAME and the RAM weight budget
; (kxrl2g's actor has a different input layer size than kxrl4d's).
[platformio]
default_envs = m5stack-atoms3
; The code that does not depend on which robot this is -- modes, the RCB-4
; link, the network stack, the phone page, main.cpp itself, the bench/probe
; builds -- lives once, in ../atom_common, and every robot's project (this
; one included) points here instead of keeping its own copy. Only lib/policy
; and lib/policy_mode (the actor tables, weights, and per-robot rise/sit
; sequences) are real files in THIS directory. A symlink was tried first and
; silently dropped by PlatformIO's dependency scanner (LDF) and its source
; filter alike -- src_dir/lib_extra_dirs are what it actually reads.
src_dir = ../atom_common/src

[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs = ../atom_common/lib
; The stub loader esptool normally uploads to RAM makes the S3's native USB
; CDC briefly drop and re-enumerate -- which is exactly the step failing here
; ("Stub running..." then no answer). Talking to the ROM bootloader directly
; instead is slower but does not touch the USB peripheral's config.
upload_flags = --no-stub
build_flags =
    -DATOM_S3
    ; Which physical robot this AtomS3 is wired to -- shown under every
    ; mode's title on the LCD (see lib/mode/mode.h). Kept here, not
    ; hardcoded, so this same source tree can be pointed at a different
    ; robot by editing one line instead of the LCD code.
    -DROBOT_NAME=\"kxrl2g\"
    ; Without these Serial is UART0, not the USB port: the host's writes go
    ; nowhere and time out. This is the "USB CDC On Boot: Enabled" the Arduino
    ; IDE asks for. ARDUINO_USB_MODE=1 selects the S3's built-in CDC/JTAG
    ; rather than TinyUSB.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Silence the Arduino log. It goes to Serial, which here is not a console
    ; but the USB CDC carrying a binary control protocol -- one library
    ; complaining mid-frame corrupts whatever the host was reading.
    -DCORE_DEBUG_LEVEL=0
    ; Copy the actor's weights into SRAM at boot -- see kxrl4d's platformio.ini
    ; for the measured cost of not doing this (an order of magnitude slower
    ; forward pass).
    -DPOLICY_WEIGHTS_IN_RAM
    ; The two largest layers (mlp.0: 77x256+256=19968 floats; mlp.2:
    ; 256x128+128=32896 floats; sum 52864 floats -- see
    ; lib/policy/policy_spec_kxrl2gwalk.h).
    -DPOLICY_RAM_WEIGHT_BYTES=211456
lib_deps =
    m5stack/M5Unified@^0.1.12
    mathertel/OneButton
build_src_filter = +<main.cpp>
upload_protocol = esptool

; Timing rig, not firmware. `pio run -e bench -t upload` replaces main with a
; harness that reports how long a forward pass and an RCB-4 servo read really
; take on this chip, which is what decides whether the control loop can live
; here at all. It is a separate env so the numbers come from the same compiler
; flags the real build uses.
[env:bench]
extends = env:m5stack-atoms3
build_src_filter = +<bench.cpp>

; Boots straight into POLICY so the control loop can be exercised from a PC
; with nobody at the button. Safe because POLICY arrives with every servo
; freed and stays that way until a host asks it to run -- but it is a testing
; build, not the one to leave on a robot.
[env:policy-boot]
extends = env:m5stack-atoms3
build_flags =
    ${env:m5stack-atoms3.build_flags}
    -DSTART_MODE_INDEX=2

; Measures how much heap is left beside the policy's weights once a radio is
; up, which is what decides whether this can go wireless at all and by which
; route.
[env:wifi-probe]
extends = env:m5stack-atoms3
build_src_filter = +<wifi_probe.cpp>

; Prints what M5Unified detects and what it reports, in library units.
[env:imu-probe]
extends = env:m5stack-atoms3
build_src_filter = +<imu_probe.cpp>
